<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>键盘发声器 · Keyboard Soundboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --brand: #4f46e5;
    --brand-light: #818cf8;
    --brand-soft: #eef2ff;
    --ink: #111827;
    --ink-2: #4b5563;
    --ink-3: #9ca3af;
    --line: #e5e7eb;
    --card: #ffffff;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 26px 20px 64px;
    background:
      radial-gradient(900px 420px at 50% -8%, #e6eaff 0%, rgba(230,234,255,0) 62%),
      linear-gradient(180deg, #fbfcff 0%, #f0f2f8 100%);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .app { max-width: 1180px; margin: 0 auto; }

  /* ---------- 顶栏 ---------- */
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 23px; font-weight: 700; letter-spacing: -0.4px; display: flex; align-items: center; gap: 10px; }
  h1 .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 5px rgba(79,70,229,.13); }
  .sub { font-size: 13px; color: var(--ink-3); margin-top: 6px; }
  .badge {
    font-size: 12px; color: var(--ink-2); background: #fff; border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 999px; display: flex; align-items: center; gap: 7px;
  }
  .badge .pulse { width: 7px; height: 7px; border-radius: 50%; background: #d1d5db; }
  .badge.on .pulse { background: #10b981; box-shadow: 0 0 0 4px rgba(16,185,129,.16); }

  /* ---------- 主面板 ---------- */
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 10px 28px -12px rgba(16,24,40,.14);
  }

  .top-row { display: grid; grid-template-columns: 240px 1fr; gap: 14px; margin-bottom: 14px; }

  /* 音名显示 */
  .display {
    padding: 16px 20px; display: flex; flex-direction: column; justify-content: center; min-height: 104px;
  }
  .note-name {
    font-size: 40px; font-weight: 700; letter-spacing: -1.5px; line-height: 1;
    font-variant-numeric: tabular-nums; transition: color .12s;
  }
  .note-freq { font-size: 12px; color: var(--ink-3); margin-top: 9px; font-variant-numeric: tabular-nums; }
  .display.idle .note-name { color: var(--ink-3); }

  /* 控制区 */
  .controls { padding: 14px 18px; display: flex; flex-direction: column; gap: 13px; justify-content: center; }
  .ctl-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ctl-label { font-size: 11px; font-weight: 600; color: var(--ink-3); letter-spacing: .8px; text-transform: uppercase; width: 44px; flex: none; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font: inherit; font-size: 12.5px; color: var(--ink-2); background: #f6f7fb;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 13px; cursor: pointer;
    transition: all .14s ease;
  }
  .chip:hover { background: #eef0f7; border-color: #d5d9e4; }
  .chip.active { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; box-shadow: 0 3px 10px -2px rgba(79,70,229,.45); }

  .btn {
    font: inherit; font-size: 12.5px; color: var(--ink-2); background: #fff;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 13px; cursor: pointer;
    transition: all .14s ease;
  }
  .btn:hover { background: #f6f7fb; }
  .btn.rec { color: #dc2626; border-color: #fecaca; background: #fef2f2; }
  .btn.rec.live { animation: blink 1.1s infinite; }
  @keyframes blink { 50% { opacity: .45; } }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .stepper { display: flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .stepper button {
    font: inherit; font-size: 15px; width: 30px; height: 30px; border: 0; background: #fff;
    color: var(--ink-2); cursor: pointer; line-height: 1;
  }
  .stepper button:hover { background: #f2f4f9; }
  .stepper .val { font-size: 12.5px; min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; color: var(--ink-2); border-left: 1px solid var(--line); border-right: 1px solid var(--line); line-height: 30px; }

  .slider { display: flex; align-items: center; gap: 9px; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 112px; height: 4px; border-radius: 4px;
    background: #e5e7eb; outline: none; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: 2px solid var(--brand); box-shadow: 0 1px 3px rgba(0,0,0,.2); cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid var(--brand); cursor: pointer;
  }

  /* ---------- 钢琴键盘 ---------- */
  .piano-wrap { padding: 16px; margin-bottom: 14px; overflow: hidden; }
  #piano { display: block; width: 100%; height: auto; }

  .wkey {
    fill: #ffffff; stroke: #d3d8e3; stroke-width: 2; cursor: pointer;
    transition: fill .06s linear;
  }
  .bkey {
    fill: #232a3a; stroke: #12161f; stroke-width: 1.5; cursor: pointer;
    transition: fill .06s linear;
  }

  .kel { cursor: pointer; }
  .kel:hover .wkey { fill: #f7f8fd; }
  .kel:hover .bkey { fill: #333c52; }
  .kel.active .wkey { fill: var(--brand); stroke: var(--brand); }
  .kel.active .bkey { fill: var(--brand-light); stroke: var(--brand-light); }
  .kel.active .klab { fill: #ffffff; }

  .klab { font-family: -apple-system, BlinkMacSystemFont, "SF Mono", Menlo, monospace; pointer-events: none; }
  .klab-w { fill: #7c8698; font-size: 34px; font-weight: 600; }
  .klab-n { fill: #b6bdcb; font-size: 27px; }
  .klab-b { fill: #8b93a5; font-size: 30px; font-weight: 600; }

  /* ---------- 打击乐 ---------- */
  .drum-wrap { padding: 16px 16px 18px; }
  .sec-title { font-size: 11px; font-weight: 600; color: var(--ink-3); letter-spacing: .8px; text-transform: uppercase; margin-bottom: 11px; }
  .drumpad { display: grid; grid-template-columns: repeat(11, 1fr); gap: 8px; }
  .drum {
    border: 1px solid var(--line); border-radius: 10px; background: #fbfcfe; padding: 12px 4px 10px;
    text-align: center; cursor: pointer; transition: all .1s ease;
  }
  .drum .cap {
    font-family: -apple-system, BlinkMacSystemFont, "SF Mono", Menlo, monospace;
    font-size: 15px; font-weight: 600; color: var(--ink); line-height: 1;
  }
  .drum .cap.sp { font-size: 11px; letter-spacing: .3px; }
  .drum .nm { font-size: 11px; color: var(--ink-3); margin-top: 7px; }
  .drum:hover { background: #f4f6fa; border-color: #d5d9e4; }
  .drum.active { background: var(--brand); border-color: var(--brand); transform: translateY(2px); box-shadow: 0 3px 10px -2px rgba(79,70,229,.4); }
  .drum.active .cap, .drum.active .nm { color: #fff; }

  /* ---------- 提示 ---------- */
  .hint { margin-top: 16px; display: flex; gap: 26px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-3); line-height: 1.9; }
  .hint b { color: var(--ink-2); font-weight: 600; }
  kbd {
    font-family: -apple-system, BlinkMacSystemFont, "SF Mono", Menlo, monospace;
    font-size: 11px; background: #fff; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 5px; color: var(--ink-2);
  }

  @media (max-width: 820px) {
    .top-row { grid-template-columns: 1fr; }
    .drumpad { grid-template-columns: repeat(5, 1fr); }
    h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div>
      <h1><span class="dot"></span>键盘发声器</h1>
      <div class="sub">按下键盘任意按键即出声 · 支持多键和弦 · 纯实时合成，无需加载音频</div>
    </div>
    <div class="badge" id="badge"><span class="pulse"></span><span id="badgeText">等待首次按键</span></div>
  </header>

  <div class="top-row">
    <div class="panel display idle" id="display">
      <div class="note-name" id="noteName">—</div>
      <div class="note-freq" id="noteFreq">按任意键开始演奏</div>
    </div>

    <div class="panel controls">
      <div class="ctl-row">
        <span class="ctl-label">音色</span>
        <div class="chips" id="timbres"></div>
      </div>
      <div class="ctl-row">
        <span class="ctl-label">控制</span>
        <div class="stepper">
          <button id="octDown" title="降低八度">−</button>
          <span class="val" id="octVal">0</span>
          <button id="octUp" title="升高八度">+</button>
        </div>
        <div class="slider"><span style="font-size:12.5px;color:#6b7280">音量</span><input type="range" id="vol" min="0" max="100" value="72"></div>
        <div class="slider"><span style="font-size:12.5px;color:#6b7280">混响</span><input type="range" id="rev" min="0" max="100" value="24"></div>
      </div>
      <div class="ctl-row">
        <span class="ctl-label">录制</span>
        <button class="btn rec" id="recBtn">● 开始录制</button>
        <button class="btn" id="playBtn" disabled>▶ 回放</button>
        <button class="btn" id="clrBtn" disabled>清空</button>
        <span style="font-size:12px;color:#9ca3af" id="recInfo">未录制</span>
      </div>
    </div>
  </div>

  <div class="panel piano-wrap">
    <svg id="piano" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="panel drum-wrap">
    <div class="sec-title">打击乐 / Drum Pads</div>
    <div class="drumpad" id="drumpad"></div>
  </div>

  <div class="hint">
    <div><b>旋律区</b> <kbd>A</kbd><kbd>W</kbd><kbd>S</kbd><kbd>E</kbd><kbd>D</kbd><kbd>F</kbd><kbd>T</kbd><kbd>G</kbd><kbd>Y</kbd><kbd>H</kbd><kbd>U</kbd><kbd>J</kbd><kbd>K</kbd><kbd>O</kbd><kbd>L</kbd><kbd>P</kbd> → C4 起半音阶</div>
    <div><b>高八度</b> <kbd>1</kbd>–<kbd>=</kbd> 白键音阶</div>
    <div><b>打击乐</b> <kbd>Z</kbd><kbd>X</kbd><kbd>C</kbd><kbd>V</kbd><kbd>B</kbd><kbd>N</kbd><kbd>M</kbd> <kbd>,</kbd><kbd>.</kbd><kbd>/</kbd> <kbd>空格</kbd></div>
    <div><b>静音全部</b> <kbd>Esc</kbd></div>
  </div>

</div>

<script>
(() => {
  "use strict";

  /* =========================================================
     1. 基础工具
     ========================================================= */
  const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  const midiToFreq = m => 440 * Math.pow(2, (m - 69) / 12);
  const isBlack = m => [1, 3, 6, 8, 10].includes(((m % 12) + 12) % 12);
  const noteLabel = m => NOTE_NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);

  /* =========================================================
     2. 音频引擎
     ========================================================= */
  let ctx = null, master = null, reverbBus = null, wetGain = null, noiseBuf = null;
  let volume = 0.72, reverbAmount = 0.24;

  function initAudio() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();

    master = ctx.createGain();
    master.gain.value = volume;

    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 24;
    comp.ratio.value = 5;
    comp.attack.value = 0.003;
    comp.release.value = 0.22;

    master.connect(comp);
    comp.connect(ctx.destination);

    // 混响总线（合成脉冲响应）
    const conv = ctx.createConvolver();
    conv.buffer = makeImpulse(2.0, 2.6);
    wetGain = ctx.createGain();
    wetGain.gain.value = reverbAmount;
    reverbBus = ctx.createGain();
    reverbBus.gain.value = 1;
    reverbBus.connect(conv);
    conv.connect(wetGain);
    wetGain.connect(master);
  }

  function makeImpulse(dur, decay) {
    const rate = ctx.sampleRate;
    const len = Math.floor(rate * dur);
    const buf = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  function getNoise() {
    if (!noiseBuf) {
      const len = Math.floor(ctx.sampleRate * 2);
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    return noiseBuf;
  }

  function audioReady() {
    initAudio();
    if (ctx.state === "suspended") ctx.resume();
    setBadge(true);
  }

  function makeOut() {
    const out = ctx.createGain();
    out.connect(master);
    out.connect(reverbBus);
    return out;
  }

  function noiseSource(dur) {
    const src = ctx.createBufferSource();
    src.buffer = getNoise();
    src.loop = true;
    src.playbackRate.value = 1;
    return src;
  }

  /* =========================================================
     3. 音色合成
     每个 voice 返回 { out, oscs, release, sustained }
     ========================================================= */
  function env(g, t, peak, atk, dec, sus, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + atk);
    g.gain.exponentialRampToValueAtTime(Math.max(sus, 0.0002), t + atk + dec);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }

  const VOICES = {

    /* 钢琴：多谐波 + 滤波包络 */
    piano(freq, t, vel) {
      const out = makeOut();
      const dur = Math.min(4.0, Math.max(1.1, 5.2 - freq / 190));
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass"; lp.Q.value = 0.6;
      lp.frequency.setValueAtTime(Math.min(freq * 9 + 1800, 13000), t);
      lp.frequency.exponentialRampToValueAtTime(Math.max(freq * 2.2, 420), t + dur);
      lp.connect(out);
      env(out, t, vel * 0.55, 0.006, 0.30, vel * 0.20, dur);

      const partials = [[1, 1, "triangle"], [2, 0.34, "sine"], [3, 0.15, "sine"], [4.02, 0.07, "sine"]];
      const oscs = [];
      for (const [ratio, amp, type] of partials) {
        const o = ctx.createOscillator();
        o.type = type;
        o.frequency.value = freq * ratio;
        o.detune.value = (Math.random() - 0.5) * 5;
        const g = ctx.createGain();
        g.gain.value = amp;
        o.connect(g); g.connect(lp);
        o.start(t); o.stop(t + dur + 0.12);
        oscs.push(o);
      }
      return { out, oscs, sustained: false };
    },

    /* 电钢：FM 金属音 */
    epiano(freq, t, vel) {
      const out = makeOut();
      const dur = Math.min(3.2, Math.max(1.0, 4.2 - freq / 260));
      env(out, t, vel * 0.5, 0.004, 0.24, vel * 0.16, dur);

      const car = ctx.createOscillator(); car.type = "sine"; car.frequency.value = freq;
      const mg = ctx.createGain();
      mg.gain.setValueAtTime(freq * 2.4, t);
      mg.gain.exponentialRampToValueAtTime(freq * 0.05, t + 0.42);
      const mod = ctx.createOscillator(); mod.type = "sine"; mod.frequency.value = freq * 3.05;
      mod.connect(mg); mg.connect(car.frequency);
      car.connect(out);

      const sub = ctx.createOscillator(); sub.type = "sine"; sub.frequency.value = freq * 0.5;
      const sg = ctx.createGain(); sg.gain.value = 0.28;
      sub.connect(sg); sg.connect(out);

      [car, mod, sub].forEach(o => { o.start(t); o.stop(t + dur + 0.1); });
      return { out, oscs: [car, mod, sub], sustained: false };
    },

    /* 风琴：谐波叠加，持续音 */
    organ(freq, t, vel) {
      const out = makeOut();
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = 5200; lp.Q.value = 0.4;
      lp.connect(out);
      out.gain.setValueAtTime(0.0001, t);
      out.gain.exponentialRampToValueAtTime(vel * 0.3, t + 0.02);

      const bars = [[1, 1], [2, 0.62], [3, 0.42], [4, 0.26], [6, 0.16], [8, 0.1]];
      const oscs = [];
      for (const [ratio, amp] of bars) {
        const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = freq * ratio;
        const g = ctx.createGain(); g.gain.value = amp;
        o.connect(g); g.connect(lp);
        o.start(t);
        oscs.push(o);
      }
      // 轻微颤音
      const lfo = ctx.createOscillator(); lfo.type = "sine"; lfo.frequency.value = 5.4;
      const lg = ctx.createGain(); lg.gain.value = 3.2;
      lfo.connect(lg);
      oscs.forEach(o => lg.connect(o.detune));
      lfo.start(t); oscs.push(lfo);

      return { out, oscs, sustained: true, release: 0.09 };
    },

    /* 合成器：双锯齿 + 滤波扫频 */
    synth(freq, t, vel) {
      const out = makeOut();
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass"; lp.Q.value = 7;
      lp.frequency.setValueAtTime(Math.min(freq * 14, 14000), t);
      lp.frequency.exponentialRampToValueAtTime(Math.max(freq * 1.6, 260), t + 0.7);
      lp.connect(out);
      out.gain.setValueAtTime(0.0001, t);
      out.gain.exponentialRampToValueAtTime(vel * 0.26, t + 0.012);
      out.gain.exponentialRampToValueAtTime(vel * 0.19, t + 0.16);

      const oscs = [];
      [-7, 7].forEach(det => {
        const o = ctx.createOscillator(); o.type = "sawtooth";
        o.frequency.value = freq; o.detune.value = det;
        const g = ctx.createGain(); g.gain.value = 0.5;
        o.connect(g); g.connect(lp);
        o.start(t); oscs.push(o);
      });
      return { out, oscs, sustained: true, release: 0.14 };
    },

    /* 木琴：极快衰减 */
    marimba(freq, t, vel) {
      const out = makeOut();
      const dur = Math.min(1.1, Math.max(0.35, 1.5 - freq / 900));
      env(out, t, vel * 0.55, 0.002, 0.10, vel * 0.12, dur);

      const oscs = [];
      [[1, 1], [4, 0.22], [9.6, 0.05]].forEach(([ratio, amp]) => {
        const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = freq * ratio;
        const g = ctx.createGain(); g.gain.value = amp;
        o.connect(g); g.connect(out);
        o.start(t); o.stop(t + dur + 0.1);
        oscs.push(o);
      });
      return { out, oscs, sustained: false };
    },

    /* 贝斯：方波 + 低通 */
    bass(freq, t, vel) {
      const out = makeOut();
      const f = freq / 2;
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass"; lp.Q.value = 5;
      lp.frequency.setValueAtTime(Math.min(f * 10, 6000), t);
      lp.frequency.exponentialRampToValueAtTime(Math.max(f * 2, 140), t + 0.45);
      lp.connect(out);
      out.gain.setValueAtTime(0.0001, t);
      out.gain.exponentialRampToValueAtTime(vel * 0.42, t + 0.008);
      out.gain.exponentialRampToValueAtTime(vel * 0.24, t + 0.25);

      const o1 = ctx.createOscillator(); o1.type = "square"; o1.frequency.value = f;
      const o2 = ctx.createOscillator(); o2.type = "sine"; o2.frequency.value = f / 2;
      const g2 = ctx.createGain(); g2.gain.value = 0.5;
      o1.connect(lp); o2.connect(g2); g2.connect(lp);
      o1.start(t); o2.start(t);
      return { out, oscs: [o1, o2], sustained: true, release: 0.12 };
    }
  };

  const TIMBRES = [
    { id: "piano", label: "钢琴" },
    { id: "epiano", label: "电钢" },
    { id: "organ", label: "风琴" },
    { id: "synth", label: "合成器" },
    { id: "marimba", label: "木琴" },
    { id: "bass", label: "贝斯" }
  ];
  let timbre = "piano";

  /* =========================================================
     4. 打击乐合成
     ========================================================= */
  const DRUMS = {
    "z": { id: "kick", name: "底鼓", key: "Z" },
    "x": { id: "snare", name: "军鼓", key: "X" },
    "c": { id: "hatC", name: "闭镲", key: "C" },
    "v": { id: "hatO", name: "开镲", key: "V" },
    "b": { id: "tomLow", name: "低嗵", key: "B" },
    "n": { id: "tomMid", name: "中嗵", key: "N" },
    "m": { id: "clap", name: "拍手", key: "M" },
    ",": { id: "crash", name: "吊镲", key: "," },
    ".": { id: "rim", name: "边击", key: "." },
    "/": { id: "cowbell", name: "牛铃", key: "/" },
    " ": { id: "impact", name: "重击", key: "空格" }
  };

  const DRUM_FN = {
    kick(t, v) {
      const out = makeOut();
      const o = ctx.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(165, t);
      o.frequency.exponentialRampToValueAtTime(42, t + 0.11);
      const g = ctx.createGain();
      g.gain.setValueAtTime(v * 1.0, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.52);
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t + 0.6);

      const n = noiseSource();
      const nf = ctx.createBiquadFilter(); nf.type = "lowpass"; nf.frequency.value = 1600;
      const ng = ctx.createGain(); ng.gain.setValueAtTime(v * 0.4, t);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
      n.connect(nf); nf.connect(ng); ng.connect(out);
      n.start(t); n.stop(t + 0.06);
    },

    snare(t, v) {
      const out = makeOut();
      const n = noiseSource();
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1900; bp.Q.value = 0.8;
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(v * 0.62, t);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      n.connect(bp); bp.connect(ng); ng.connect(out);
      n.start(t); n.stop(t + 0.25);

      const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = 192;
      const g = ctx.createGain();
      g.gain.setValueAtTime(v * 0.34, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t + 0.15);
    },

    hatC(t, v) {
      const out = makeOut();
      const n = noiseSource();
      const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 8200;
      const g = ctx.createGain();
      g.gain.setValueAtTime(v * 0.3, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
      n.connect(hp); hp.connect(g); g.connect(out);
      n.start(t); n.stop(t + 0.08);
    },

    hatO(t, v) {
      const out = makeOut();
      const n = noiseSource();
      const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 7200;
      const g = ctx.createGain();
      g.gain.setValueAtTime(v * 0.26, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
      n.connect(hp); hp.connect(g); g.connect(out);
      n.start(t); n.stop(t + 0.4);
    },

    tomLow(t, v) { tom(t, v, 190, 82, 0.42); },
    tomMid(t, v) { tom(t, v, 280, 130, 0.34); },

    clap(t, v) {
      const out = makeOut();
      for (let i = 0; i < 3; i++) {
        const st = t + i * 0.011;
        const n = noiseSource();
        const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1250; bp.Q.value = 1.1;
        const g = ctx.createGain();
        g.gain.setValueAtTime(v * (0.34 - i * 0.05), st);
        g.gain.exponentialRampToValueAtTime(0.0001, st + 0.028);
        n.connect(bp); bp.connect(g); g.connect(out);
        n.start(st); n.stop(st + 0.05);
      }
      const n = noiseSource();
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1150; bp.Q.value = 0.7;
      const g = ctx.createGain();
      g.gain.setValueAtTime(v * 0.22, t + 0.033);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
      n.connect(bp); bp.connect(g); g.connect(out);
      n.start(t + 0.033); n.stop(t + 0.3);
    },

    crash(t, v) {
      const out = makeOut();
      const n = noiseSource();
      const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 4800;
      const g = ctx.createGain();
      g.gain.setValueAtTime(v * 0.34, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.55);
      n.connect(hp); hp.connect(g); g.connect(out);
      n.start(t); n.stop(t + 1.7);
    },

    rim(t, v) {
      const out = makeOut();
      const o = ctx.createOscillator(); o.type = "square"; o.frequency.value = 420;
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2200; bp.Q.value = 3;
      const g = ctx.createGain();
      g.gain.setValueAtTime(v * 0.3, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
      o.connect(bp); bp.connect(g); g.connect(out);
      o.start(t); o.stop(t + 0.06);
    },

    cowbell(t, v) {
      const out = makeOut();
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = 2600; bp.Q.value = 1.4;
      const g = ctx.createGain();
      g.gain.setValueAtTime(v * 0.24, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
      bp.connect(g); g.connect(out);
      [540, 800].forEach(f => {
        const o = ctx.createOscillator(); o.type = "square"; o.frequency.value = f;
        const og = ctx.createGain(); og.gain.value = 0.5;
        o.connect(og); og.connect(bp);
        o.start(t); o.stop(t + 0.4);
      });
    },

    impact(t, v) {
      DRUM_FN.kick(t, v * 1.1);
      DRUM_FN.crash(t, v * 0.55);
    }
  };

  function tom(t, v, f0, f1, dur) {
    const out = makeOut();
    const o = ctx.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.7);
    const g = ctx.createGain();
    g.gain.setValueAtTime(v * 0.55, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + dur + 0.05);

    const n = noiseSource();
    const nf = ctx.createBiquadFilter(); nf.type = "bandpass"; nf.frequency.value = f0 * 3; nf.Q.value = 1;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(v * 0.16, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.4);
    n.connect(nf); nf.connect(ng); ng.connect(out);
    n.start(t); n.stop(t + dur);
  }

  /* =========================================================
     5. 键盘映射
     ========================================================= */
  const MELODY = {
    "a": 60, "w": 61, "s": 62, "e": 63, "d": 64, "f": 65, "t": 66,
    "g": 67, "y": 68, "h": 69, "u": 70, "j": 71, "k": 72, "o": 73,
    "l": 74, "p": 75, ";": 76, "'": 77
  };
  const DIGITS = {
    "1": 72, "2": 74, "3": 76, "4": 77, "5": 79, "6": 81,
    "7": 83, "8": 84, "9": 86, "0": 88, "-": 89, "=": 91
  };
  const KEY_MAP = Object.assign({}, MELODY, DIGITS);

  // 反向索引：midi -> 主要按键（旋律区优先）
  const MIDI_TO_KEY = {};
  for (const k of Object.keys(MELODY)) if (MIDI_TO_KEY[MELODY[k]] === undefined) MIDI_TO_KEY[MELODY[k]] = k;
  for (const k of Object.keys(DIGITS)) if (MIDI_TO_KEY[DIGITS[k]] === undefined) MIDI_TO_KEY[DIGITS[k]] = k;

  const LOW = 60, HIGH = 91;

  /* =========================================================
     6. 发声调度
     ========================================================= */
  let octave = 0;
  const activeVoices = new Map();   // pressedId -> voice
  const pressedKeys = new Set();

  function triggerNote(srcId, midi, vel) {
    audioReady();
    vel = vel === undefined ? 0.85 : vel;
    const m = midi + octave * 12;
    const t = ctx.currentTime + 0.001;
    let voice = null;
    try { voice = VOICES[timbre](midiToFreq(m), t, vel); } catch (e) { /* 忽略调度异常 */ }
    if (voice) activeVoices.set(srcId, voice);

    highlight(midi, true);
    showNote(midi);
    if (recording) recPush({ kind: "note", midi, vel });
    return voice;
  }

  function releaseNote(srcId) {
    const v = activeVoices.get(srcId);
    if (!v) return;
    activeVoices.delete(srcId);
    if (!v.sustained) return;
    const now = ctx.currentTime;
    try {
      v.out.gain.cancelScheduledValues(now);
      v.out.gain.setValueAtTime(Math.max(v.out.gain.value, 0.0001), now);
      v.out.gain.exponentialRampToValueAtTime(0.0001, now + v.release);
      v.oscs.forEach(o => { try { o.stop(now + v.release + 0.05); } catch (e) {} });
    } catch (e) {}
  }

  function triggerDrum(srcId, drumKey) {
    audioReady();
    const d = DRUMS[drumKey];
    if (!d) return;
    DRUM_FN[d.id](ctx.currentTime + 0.001, 0.9);
    highlightDrum(drumKey, true);
    setTimeout(() => highlightDrum(drumKey, false), 130);
    showDrum(d);
    if (recording) recPush({ kind: "drum", drum: drumKey });
  }

  function stopAll() {
    activeVoices.forEach((v, id) => releaseNote(id));
    activeVoices.clear();
    pressedKeys.clear();
    document.querySelectorAll(".active").forEach(el => el.classList.remove("active"));
  }

  /* =========================================================
     7. 视觉反馈
     ========================================================= */
  const keyEls = {};
  const drumEls = {};

  function highlight(midi, on) {
    const el = keyEls[midi];
    if (el) el.classList.toggle("active", on);
  }

  function highlightDrum(k, on) {
    const el = drumEls[k];
    if (el) el.classList.toggle("active", on);
  }

  const displayEl = document.getElementById("display");
  const noteNameEl = document.getElementById("noteName");
  const noteFreqEl = document.getElementById("noteFreq");

  function showNote(midi) {
    const m = midi + octave * 12;
    displayEl.classList.remove("idle");
    noteNameEl.textContent = noteLabel(m);
    noteFreqEl.textContent = midiToFreq(m).toFixed(1) + " Hz · MIDI " + m + " · 键位 " + keyCap(midi);
  }

  function showDrum(d) {
    displayEl.classList.remove("idle");
    noteNameEl.textContent = d.name;
    noteFreqEl.textContent = "打击乐 · 键位 " + d.key;
  }

  function keyCap(midi) {
    const k = MIDI_TO_KEY[midi];
    if (k === undefined) return "—";
    if (k === " ") return "空格";
    if (k === ";") return ";";
    if (k === "'") return "'";
    return k.toUpperCase();
  }

  /* =========================================================
     8. 渲染钢琴键盘
     ========================================================= */
  function buildKeyboard() {
    const svg = document.getElementById("piano");
    const NS = "http://www.w3.org/2000/svg";
    const whites = [], blacks = [];
    for (let m = LOW; m <= HIGH; m++) (isBlack(m) ? blacks : whites).push(m);

    const WW = 100, KH = 300, BW = 62, BH = 188;
    const totalW = whites.length * WW;
    svg.setAttribute("viewBox", "0 0 " + totalW + " " + KH);
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

    const whiteIndex = {};
    whites.forEach((m, i) => { whiteIndex[m] = i; });

    const mkText = (x, y, cls, content) => {
      const tx = document.createElementNS(NS, "text");
      tx.setAttribute("x", x);
      tx.setAttribute("y", y);
      tx.setAttribute("text-anchor", "middle");
      tx.setAttribute("class", "klab " + cls);
      tx.textContent = content;
      return tx;
    };

    // 白键（整组：底板 + 键位字母 + 音名）
    whites.forEach((m, i) => {
      const grp = document.createElementNS(NS, "g");
      grp.setAttribute("class", "kel");
      grp.dataset.midi = m;

      const rect = document.createElementNS(NS, "rect");
      rect.setAttribute("x", i * WW + 1);
      rect.setAttribute("y", 0);
      rect.setAttribute("width", WW - 2);
      rect.setAttribute("height", KH);
      rect.setAttribute("rx", 7);
      rect.setAttribute("class", "wkey");
      grp.appendChild(rect);

      const cap = MIDI_TO_KEY[m];
      if (cap !== undefined) {
        grp.appendChild(mkText(i * WW + WW / 2, 196, "klab-w", cap === " " ? "␣" : cap.toUpperCase()));
      }
      grp.appendChild(mkText(i * WW + WW / 2, 262, "klab-n", noteLabel(m)));

      svg.appendChild(grp);
      keyEls[m] = grp;
      bindPointer(grp, m);
    });

    // 黑键
    blacks.forEach(m => {
      const i = whiteIndex[m - 1];
      if (i === undefined) return;
      const x = (i + 1) * WW - BW / 2;

      const grp = document.createElementNS(NS, "g");
      grp.setAttribute("class", "kel");
      grp.dataset.midi = m;

      const rect = document.createElementNS(NS, "rect");
      rect.setAttribute("x", x);
      rect.setAttribute("y", 0);
      rect.setAttribute("width", BW);
      rect.setAttribute("height", BH);
      rect.setAttribute("rx", 5);
      rect.setAttribute("class", "bkey");
      grp.appendChild(rect);

      const cap = MIDI_TO_KEY[m];
      if (cap !== undefined) {
        grp.appendChild(mkText(x + BW / 2, 138, "klab-b", cap.toUpperCase()));
      }

      svg.appendChild(grp);
      keyEls[m] = grp;
      bindPointer(grp, m);
    });
  }

  function bindPointer(el, midi) {
    const id = "m" + midi;
    el.addEventListener("pointerdown", e => {
      e.preventDefault();
      el.setPointerCapture && el.setPointerCapture(e.pointerId);
      triggerNote(id, midi, 0.88);
    });
    const up = () => releaseNote(id);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    el.addEventListener("pointerleave", up);
  }

  /* =========================================================
     9. 渲染打击乐面板
     ========================================================= */
  function buildDrumpad() {
    const wrap = document.getElementById("drumpad");
    for (const k of Object.keys(DRUMS)) {
      const d = DRUMS[k];
      const el = document.createElement("div");
      el.className = "drum";
      el.innerHTML =
        '<div class="cap' + (k === " " ? " sp" : "") + '">' + escapeHtml(d.key) + '</div>' +
        '<div class="nm">' + escapeHtml(d.name) + '</div>';
      el.addEventListener("pointerdown", e => { e.preventDefault(); triggerDrum(k, k); });
      wrap.appendChild(el);
      drumEls[k] = el;
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  /* =========================================================
     10. 控制栏
     ========================================================= */
  function buildTimbres() {
    const wrap = document.getElementById("timbres");
    TIMBRES.forEach(t => {
      const b = document.createElement("button");
      b.className = "chip" + (t.id === timbre ? " active" : "");
      b.textContent = t.label;
      b.addEventListener("click", () => {
        timbre = t.id;
        wrap.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
        b.classList.add("active");
      });
      wrap.appendChild(b);
    });
  }

  const octVal = document.getElementById("octVal");
  function setOctave(d) {
    octave = Math.max(-2, Math.min(2, octave + d));
    octVal.textContent = (octave > 0 ? "+" : "") + octave;
  }

  function setBadge(on) {
    const b = document.getElementById("badge");
    b.classList.toggle("on", on);
    document.getElementById("badgeText").textContent = on ? "音频已就绪" : "等待首次按键";
  }

  /* =========================================================
     11. 录制 / 回放
     ========================================================= */
  let recording = false, recStart = 0, recData = [], playing = false, playTimers = [];

  const recBtn = document.getElementById("recBtn");
  const playBtn = document.getElementById("playBtn");
  const clrBtn = document.getElementById("clrBtn");
  const recInfo = document.getElementById("recInfo");

  function recPush(ev) {
    ev.t = performance.now() - recStart;
    recData.push(ev);
    recInfo.textContent = "已录制 " + recData.length + " 个事件";
  }

  recBtn.addEventListener("click", () => {
    if (playing) return;
    if (!recording) {
      recording = true;
      recStart = performance.now();
      recData = [];
      recBtn.textContent = "■ 停止录制";
      recBtn.classList.add("live");
      recInfo.textContent = "录制中…";
      playBtn.disabled = true;
      clrBtn.disabled = true;
    } else {
      recording = false;
      recBtn.textContent = "● 重新录制";
      recBtn.classList.remove("live");
      recInfo.textContent = recData.length ? "已录制 " + recData.length + " 个事件" : "未录制";
      playBtn.disabled = !recData.length;
      clrBtn.disabled = !recData.length;
    }
  });

  playBtn.addEventListener("click", () => {
    if (playing || !recData.length || recording) return;
    playing = true;
    playBtn.textContent = "▶ 回放中…";
    playBtn.disabled = true;
    recBtn.disabled = true;

    const total = recData[recData.length - 1].t;
    recData.forEach(ev => {
      const tid = setTimeout(() => {
        if (ev.kind === "note") {
          const v = triggerNote("pb", ev.midi, ev.vel);
          setTimeout(() => releaseNote("pb"), 220);
        } else {
          triggerDrum(ev.drum, ev.drum);
        }
      }, ev.t);
      playTimers.push(tid);
    });

    playTimers.push(setTimeout(() => {
      playing = false;
      playBtn.textContent = "▶ 回放";
      playBtn.disabled = false;
      recBtn.disabled = false;
      playTimers = [];
    }, total + 400));
  });

  clrBtn.addEventListener("click", () => {
    recData = [];
    recInfo.textContent = "未录制";
    playBtn.disabled = true;
    clrBtn.disabled = true;
    recBtn.textContent = "● 开始录制";
  });

  /* =========================================================
     12. 键盘事件
     ========================================================= */
  window.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;

    if (k === "Escape") { stopAll(); return; }
    if (e.repeat) return;

    const isNote = Object.prototype.hasOwnProperty.call(KEY_MAP, k);
    const isDrum = Object.prototype.hasOwnProperty.call(DRUMS, k);
    if (!isNote && !isDrum) return;

    e.preventDefault();
    if (pressedKeys.has(k)) return;
    pressedKeys.add(k);

    if (isNote) triggerNote(k, KEY_MAP[k], 0.85);
    else triggerDrum(k, k);
  });

  window.addEventListener("keyup", e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (!pressedKeys.has(k)) return;
    pressedKeys.delete(k);
    releaseNote(k);
    if (Object.prototype.hasOwnProperty.call(KEY_MAP, k)) {
      const midi = KEY_MAP[k];
      setTimeout(() => {
        // 若没有其它按下的键映射到同一个音，则取消高亮
        let still = false;
        pressedKeys.forEach(pk => { if (KEY_MAP[pk] === midi) still = true; });
        if (!still) highlight(midi, false);
      }, 60);
    }
  });

  window.addEventListener("blur", () => stopAll());

  /* =========================================================
     13. 初始化
     ========================================================= */
  buildKeyboard();
  buildDrumpad();
  buildTimbres();

  document.getElementById("octDown").addEventListener("click", () => setOctave(-1));
  document.getElementById("octUp").addEventListener("click", () => setOctave(1));

  document.getElementById("vol").addEventListener("input", e => {
    volume = e.target.value / 100;
    if (master) master.gain.setTargetAtTime(volume, ctx.currentTime, 0.02);
  });
  document.getElementById("rev").addEventListener("input", e => {
    reverbAmount = e.target.value / 100;
    if (wetGain) wetGain.gain.setTargetAtTime(reverbAmount, ctx.currentTime, 0.05);
  });

  // 手势结束后自动释放鼠标触发的音
  window.addEventListener("pointerup", () => {
    Array.from(activeVoices.keys()).filter(id => id.startsWith("m")).forEach(releaseNote);
  });
})();
</script>
</body>
</html>
